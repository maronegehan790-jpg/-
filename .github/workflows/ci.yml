name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real PostgreSQL and Redis for the integration tests (T072). Constitution
    # Principle II requires integration tests to run against a real database,
    # and Principle VI puts rate-limit counters in Redis, so both services must
    # exist in CI rather than being mocked.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Only the development database is created here. The test database
          # (zizo_lms_test) is provisioned by the T071 globalSetup.
          POSTGRES_DB: zizo_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zizo_lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    # backend/.env is gitignored, so every variable the test harness reads has to
    # be supplied here. The test datastores MUST differ from the development ones
    # or the T071 guards abort the run: a different database for PostgreSQL
    # (zizo_lms vs zizo_lms_test) and a different database index for Redis
    # (0 vs 1).
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zizo_lms?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zizo_lms_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      # CI-only throwaway values. Not secrets: they sign tokens that exist for
      # the duration of one test run. Length satisfies the 32-char minimum.
      JWT_ACCESS_SECRET: ci_access_secret_for_tests_only_32chars
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests_only_32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        id: e2e
        run: npm run test:e2e

      # Only uploaded when the e2e step itself failed, so green runs stay artifact-free.
      - name: Upload Playwright report
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
